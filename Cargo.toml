[package]
name = "rpc_rust_distributed_system"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
thiserror = "1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
anyhow = "1"

[dev-dependencies]
proptest = "1"
